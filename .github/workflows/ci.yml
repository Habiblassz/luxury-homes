name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Audit
        run: npm audit --audit-level=high || true # Prevent high audits from entirely blocking builds temporarily

      - name: Run Linting
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Tests with Coverage
        run: npm run test:coverage
        env:
          CI: true
